services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: content-factory-app
    restart: unless-stopped
    env_file:
      - path: ${CONTENT_FACTORY_ENV_FILE:-/opt/content-factory/.env}
        required: false
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    volumes:
      - ${CONTENT_FACTORY_DATA_DIR:-/opt/content-factory/data}:/app/data
      - ${CONTENT_FACTORY_UPLOADS_DIR:-/opt/content-factory/uploads}:/app/uploads
    expose:
      - "3000"
    networks:
      - content-factory

  nginx:
    image: nginx:1.27-alpine
    container_name: content-factory-nginx
    depends_on:
      - app
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${CONTENT_FACTORY_BASIC_AUTH_FILE:-/opt/content-factory/nginx/.htpasswd}:/etc/nginx/.htpasswd:ro
      - ${CONTENT_FACTORY_LOGS_DIR:-/opt/content-factory/logs/nginx}:/var/log/nginx
    networks:
      - content-factory

networks:
  content-factory:
    driver: bridge
